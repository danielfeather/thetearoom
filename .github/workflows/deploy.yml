name: Build and Deploy

on: 
  push:
    branches:
      - "main"
  
jobs:
    build:
      permissions:
        packages: write
      runs-on: ubuntu-24.04-arm
      steps:

        - name: Docker meta
          id: meta
          uses: docker/metadata-action@v5
          with:
            # list of Docker images to use as base name for tags
            images: |
              ghcr.io/danielfeather/thetearoom
            tags: |
              type=ref,event=branch
              type=sha

        - name: Login to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        
        - name: Build and push
          uses: docker/build-push-action@v6
          with:
            push: true
            file: docker/production/Dockerfile
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
  
    deploy:
      runs-on: ubuntu-latest
      needs: build
      permissions:
        id-token: write
        contents: read
      steps:
        - uses: azure/setup-kubectl@v4

        - name: Get OIDC token from GitHub
          id: get_token
          run: |
            token_json=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=coffee-lucca-poc")
            oidc_token=$(echo "$token_json" | jq -r '.value')
            echo "token=${oidc_token}" >> $GITHUB_OUTPUT

        - name: Debug JWT token claims
          run: |
            echo "Decoding JWT token for debugging..."
            echo "${{ steps.get_token.outputs.token }}" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq . || echo "Failed to decode JWT payload"

        - name: Setup config
          run: |
            ls
            kubectl config set-cluster default --server=${{ secrets.K8S_SERVER_URL }} --certificate-authority=./ca_cert.crt
            kubectl config set-credentials default --client-certificate=./client.crt --client-key=./client.key
            kubectl config set-context default --namespace=default --user=default --cluster=default
            kubectl config use-context default

        - name: Restart Deployment
          run: kubectl rollout restart deployment/thetearoom -n thetearoom --token ${{ steps.get_token.outputs.token }}
            